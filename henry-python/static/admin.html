<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Henry admin</title>
<style>body{font:16px system-ui;background:#14102b;color:#fff;max-width:760px;margin:0 auto;padding:20px}input,select,button{font:inherit;padding:10px 14px;border-radius:999px;border:0;margin:4px 0}
button{background:#2ec4b6;color:#052e2a;font-weight:700;cursor:pointer}.r{background:#2a2160;border-radius:18px;padding:14px;margin:10px 0}.bad{color:#ff9f1c;font-weight:700}code{word-break:break-all;display:block;background:#000;padding:8px;border-radius:10px;margin-top:6px}</style></head><body>
<h1>Henry payments</h1><input id="pw" type="password" placeholder="Admin password"><button id="go">Load</button><p id="msg"></p><div id="list"></div>
<h2>Issue a key by hand</h2><input id="n" placeholder="Customer name"><select id="p"><option>Plus</option><option>Pro</option></select><input id="d" type="number" value="30" style="width:90px"><button id="mk">Create key</button><code id="key"></code>
<script>
const $=i=>document.getElementById(i);const H=()=>({"X-Admin":$("pw").value,"Content-Type":"application/json"});
async function load(){const r=await fetch("/api/admin/claims",{headers:H()});if(!r.ok){$("msg").textContent="Wrong password, or ADMIN_PASSWORD is not set.";return}$("msg").textContent="";const a=await r.json();$("list").innerHTML="";
if(!a.length)$("list").textContent="No pending payments.";a.forEach(c=>{const d=document.createElement("div");d.className="r";d.textContent=c.name+" · "+c.phone+" · "+c.plan+" (KES "+({Plus:250,Pro:700}[c.plan])+") · code "+c.code;
if(c.dup){const w=document.createElement("div");w.className="bad";w.textContent="Warning: this code was already used or submitted twice";d.appendChild(w)}
[["Approve",1],["Reject",0]].forEach(([t,v])=>{const b=document.createElement("button");b.textContent=t;b.onclick=async()=>{await fetch("/api/admin/decide",{method:"POST",headers:H(),body:JSON.stringify({id:c.id,approve:!!v})});load()};d.appendChild(b)});$("list").appendChild(d)})}
$("go").onclick=load;$("mk").onclick=async()=>{const r=await fetch("/api/admin/issue",{method:"POST",headers:H(),body:JSON.stringify({name:$("n").value,plan:$("p").value,days:+$("d").value})});const j=await r.json();$("key").textContent=j.token||"Error"};
</script></body></html>
